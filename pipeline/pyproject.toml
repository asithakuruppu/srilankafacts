[project]
name = "slf"
version = "0.0.1"
description = "Sri Lanka Facts data pipeline: snapshot, extract, harmonise, validate, publish"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "geopandas>=1.2.0",
    "pyogrio>=0.13.0",
    "pyarrow>=26.0.1",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
slf = "slf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["slf", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Report templates with long prose lines; splitting them would hurt readability.
"slf/datasets/crosswalk_admin.py" = ["E501"]
