id: population_sector_urban_share
name: "Share of population by sector: Urban (including estate urban)"
short_name: "Sector: Urban (%)"
topic: [population, sector]
measure_type: share
unit: percent
universe: persons
numerator: population_sector_urban
denominator: population_total
aggregation: recompute_from_components
higher_is: neutral
decimals: 1
sensitivity: public
definition: >
  population_sector_urban divided by the total population in the same file, times 100. Computed from the
  published counts. DCS combines its "Urban" and "Estate Urban" sectors and presents them as "Urban".
source_definition_ref: "CPH 2024, Population by Sector and GN Division, column 'Urban*'"
methodology_notes: docs/methods/census-2024-age-sector-local-authority.md
