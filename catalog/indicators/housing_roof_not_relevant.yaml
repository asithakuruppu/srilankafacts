definition: >
  Number of occupied housing units whose main roof material is "Not relevant", as recorded by the Census of Population
  and Housing 2024. Each housing unit is counted in exactly one category. Published by DCS for
  DS divisions and districts only; there is no GN breakdown. DCS's category "Not Relavent" (spelling as printed). In every place it equals the number of housing units of structure "Other"; the table does not explain it.
source_definition_ref: "CPH 2024, Housing table A11 (district and DS) and A3 (district), column 'Not Relavent'"
