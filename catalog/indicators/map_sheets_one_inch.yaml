definition: >
  Number of sheets of the Survey Department of Ceylon one-inch map series (1:63,360, 1958-1976)
  whose footprint overlaps at least 1% of the place's area. For a district or province it counts
  distinct sheets, not the sum over its divisions. From a sheet index, not from the maps.
