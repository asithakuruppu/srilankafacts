id: map_sheets_one_inch
name: "Historical one-inch map sheets covering the place"
short_name: "Historical one-inch map sheets covering the place"
topic: [landscape, history]
measure_type: count
unit: sheets
universe: mapped_features
numerator: null
denominator: null
aggregation: none
higher_is: neutral
distribution: api
decimals: 0
