definition: >
  Votes obtained by one candidate, as printed on the result sheet. The candidate is given in the breakdown
  (ballot number, name as printed, party abbreviation as printed). For the 2024 presidential election these
  are first-preference votes; preference counts are a separate result not ingested here.
