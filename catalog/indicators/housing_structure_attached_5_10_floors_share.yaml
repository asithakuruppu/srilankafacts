definition: >
  housing_structure_attached_5_10_floors divided by the number of occupied housing units in the same table, times 100.
  Computed from the published counts. DS divisions and larger areas only. DCS's English heading reads "Attached House - 5th to 10th Floors"; the Sinhala and Tamil headings give the number of floors of the building, which is how this name reads it (not confirmed by DCS).
