id: population_ethnicity_other
name: "Population by ethnic group: Other"
short_name: "Ethnic group: Other"
topic: [population, ethnicity]
measure_type: count
unit: persons
universe: persons
numerator: null
denominator: null
aggregation: sum
higher_is: neutral
distribution: places_only
decimals: 0
sensitivity: sensitive_group
definition: >
  Number of persons whose ethnic group is recorded as "Other" by the Census of Population and Housing
  2024, using DCS's category name. Each person is counted in exactly one category.
  Published by DCS for DS divisions and districts; values here come from those tables, never from sums of GN values, because DCS's GN files fold groups of fewer than 10 people into "Other" (D-033).
source_definition_ref: "CPH 2024, Population table A6 (district and DS) and A2 (district), column 'Other'"
methodology_notes: docs/methods/census-2024-ethnicity-religion.md
