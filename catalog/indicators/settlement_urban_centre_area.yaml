id: settlement_urban_centre_area
name: "Area in an urban centre"
short_name: "Area in an urban centre"
topic: [landscape, settlement]
measure_type: count
unit: hectares
universe: land_area_measured
numerator: null
denominator: null
aggregation: sum
higher_is: neutral
distribution: api
decimals: 1
sensitivity: public
definition: >
  Ground area in 1 km cells classed as 'urban centre' by the Degree of Urbanisation method
  (GHS-SMOD R2023A, 2020): contiguous cells of at least 1,500 inhabitants per km² with at least
  50,000 inhabitants in total. This is a density rule, not Sri Lanka's administrative urban
  definition.
source_definition_ref: "ghsl-settlement-model (catalog/datasets/ghsl-settlement-model.yaml)"
methodology_notes: docs/methods/landscape.md
