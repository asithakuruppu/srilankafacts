id: votes_candidate_share
name: Share of valid votes obtained by a candidate
short_name: Votes (candidate, %)
topic: [elections]
measure_type: share
unit: percent
universe: votes
numerator: votes_candidate
denominator: votes_valid
aggregation: recompute_from_components
higher_is: neutral
decimals: 2
sensitivity: public
definition: >
  votes_candidate divided by votes_valid, times 100, computed from the counts on the result sheet (the
  printed percentage is used only as a check). The candidate is given in the breakdown.
source_definition_ref: "Election Commission result sheet, columns 'Votes Obtained' and 'Percentage'"
methodology_notes: docs/methods/election-results.md
