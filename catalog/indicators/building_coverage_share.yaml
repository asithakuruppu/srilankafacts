id: building_coverage_share
name: "Share of the place covered by mapped footprints"
short_name: "Share of the place covered by mapped footprints"
topic: [features]
measure_type: share
unit: percent
universe: mapped_features
numerator: building_footprint_area
denominator: land_cover_mapped_area
aggregation: recompute_from_components
higher_is: neutral
distribution: api
decimals: 3
sensitivity: public
definition: >
  Total mapped footprint area divided by the place's measured land area (land_cover_mapped_area).
  Footprint area is computed in EPSG:5235.
source_definition_ref: "overture-buildings (catalog/datasets/overture-buildings.yaml)"
methodology_notes: docs/methods/landscape.md
