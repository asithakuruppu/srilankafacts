definition: >
  Building footprints in Overture Maps (OpenStreetMap, Microsoft and Google footprints, merged by
  Overture) whose inside point falls in the place. Machine-detected footprints include sheds,
  outbuildings and some false detections, and miss some buildings under tree cover; this is not a
  count of houses or households.
