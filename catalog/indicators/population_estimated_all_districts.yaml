definition: >
  Estimated population of the whole island for each year 1891-1946, all districts included, from Chandra and Sarathchandra (2014) as published on Harvard Dataverse. A smooth national reconstruction with one growth rate, not a census count or a yearly enumeration. The year 1918 appears twice in the source with different values.
