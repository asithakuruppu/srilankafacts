definition: >
  Area-weighted mean of the calendar-year rainfall total over the 0.05 degree (about 5 km) CHIRPS
  v3.0 cells whose area falls inside the place. A satellite-and-gauge estimate; a cell is shared
  between the places it overlaps, so small places carry the information of the cell around them.
