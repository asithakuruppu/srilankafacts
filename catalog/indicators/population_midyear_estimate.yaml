definition: >
  Estimated population on 1 July by district of usual residence, in thousands, from the Registrar General's Department as published by DCS. 2014-2024 are carried forward from Census 2012 and 2025-2026 from Census 2024, so the step between 2024 and 2025 is a change of basis, not a change in population.
source_definition_ref: "DCS Vital Statistics: Mid-year Population Estimates by District & Sex, 2014-2024 and 2025-2026"
