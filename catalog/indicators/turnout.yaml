id: turnout
name: Turnout (votes polled as a share of registered electors)
short_name: Turnout (%)
topic: [elections]
measure_type: share
unit: percent
universe: registered_electors
numerator: votes_polled
denominator: electors_registered
aggregation: recompute_from_components
higher_is: neutral
decimals: 2
sensitivity: public
definition: >
  votes_polled divided by electors_registered, times 100, computed from the counts on the result sheet
  (the sheet's own printed percentage is used only as a check). For postal-vote results the denominator is
  the number of postal voters printed on that sheet, so postal turnout is not comparable with polling
  division turnout.
source_definition_ref: "Election Commission result sheet, lines 'Number of Votes Polled' and 'Number of Registered Electors'"
methodology_notes: docs/methods/election-results.md
