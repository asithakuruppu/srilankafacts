definition: >
  Number of occupied housing units whose structure is "Attached house, 11 to 19 floors", as recorded by the Census of Population
  and Housing 2024. Each housing unit is counted in exactly one category. Published by DCS for
  DS divisions and districts only; there is no GN breakdown. DCS's English heading reads "Attached House - 11th to 19th Floors"; the Sinhala and Tamil headings give the number of floors of the building, which is how this name reads it (not confirmed by DCS).
source_definition_ref: "CPH 2024, Housing table A9 (district and DS) and A1 (district), column 'Attached House - 11th to 19th Floors'"
methodology_notes: docs/methods/census-2024-housing-materials.md
