notes: 10 epochs (1975-2020, every 5 years) x 4 tiles held (2026-11-17). CRS read from the files (World
  Mollweide). Cells are shared between places by 20 m sub-cells; ground areas are corrected for the projection's
  spherical formulas (docs/methods/landscape.md). Early epochs are modelled back from later imagery, so
  growth is an estimate, not a measurement.
