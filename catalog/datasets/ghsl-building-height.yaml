notes: 4 tiles held (2026-11-17), rolled up 2026-11-21 on the 100 m grid with 20 m sub-cells like GHS-BUILT-S. ANBH is the modelled average net building height of a cell in metres (0 = none, -1 = no data); a place's mean counts cells with a height above zero only, weighted by ground area. The lowest modelled height in the held tiles is 2.5 m, so most rural places read close to 2.5 m. Modelled, not surveyed. Used by the `form` space v0.1 (docs/methods/form-context.md).
