notes: >-
  Integrated 2026-11-18 for 1996, 2010 and 2020 (the 2007-2019 intermediate years and the union layer are
  not used). CRS read from the files (EPSG:4326, 0.000222 degree, 1 = mangrove). Tile names give the north-west
  corner (N08E079 covers 7-8 N); the 10 tiles touching Sri Lanka were read. Our national sum inside GN
  polygons is 24,543 / 17,272 / 17,333 ha (1996 / 2010 / 2020); GMW's own country table gives 25,861 /
  19,734 / 19,874 ha, 5-13% higher. Not explained: the table may use a different area method and counts
  mangrove outside the GN land polygons ❓. WorldCover's mangrove class gives 14,058 ha for 2021, a
  different method that is not expected to agree. GMW warns that its gains and losses should not be used
  independently; only extent is used here.
