notes: >
  Stage 3. Held: two DCS Excel workbooks (births, deaths and marriages registered by district 2019-2025, by place of occurrence; crude birth and death rates by province, district and sex 2019-2025, by usual residence) and two PDFs of the Registrar General's mid-year population estimates by district and sex (2014-2024 on the Census 2012 basis; 2025-2026 on the Census 2024 basis, a series break). Values from 2021/2022 on are provisional as marked. Not yet ingested from the same page: infant, neonatal, under-five and maternal mortality by district 2012-2021, and district life tables. Method: docs/methods/stat-tables.md.
