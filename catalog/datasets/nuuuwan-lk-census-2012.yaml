notes: >
  Repository MIT (code); the figures originate from DCS, so their rights follow DCS. Holds, per
  topic, the DCS-authored source PDF, a raw parse and a parse with region ids. The region ids are
  assigned by name matching to a later GN list, so they are not used: our own parse of the same PDF
  matches GNs on DCS GN numbers (slf.history). Snapshotted at commit 8d8af05: population-gender
  source.pdf and data.json. Cross-check and mirror only (D-008); see D-035.
