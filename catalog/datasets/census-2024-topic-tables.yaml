notes: >
  Snapshotted 2026-11-12 (31 workbooks plus the landing page). Ingested so far (D-032 step a):
  households and the four amenity groups from HH_GND_excel.xlsx, 37 category counts and 37
  shares, summed to DS, district, province and country and checked against district tables
  A5-A8 (method: docs/methods/census-2024-households.md). Step b: five-year age group, sector
  and local authority type from the three GN population files, 25 counts and 26 shares, checked
  against DCS's subtotal lines (method: docs/methods/census-2024-age-sector-local-authority.md).
  Step c: housing unit structure and wall, roof and floor materials for DS divisions, districts
  and Sri Lanka from Housing tables A9-A12, checked against A1-A4; 37 counts and 37 shares. Their
  information floor is the DS division (ds-2024), not the GN; DS names join to DCS DS codes
  through catalog/geographies/name-matches/dcs-census2024-a-series-ds.csv, each match checked
  against GN occupied housing units (method: docs/methods/census-2024-housing-materials.md).
  Not yet in any release. GN level:
  households with drinking water, cooking fuel, lighting and toilet (14,008 GN rows); population
  by ethnic group, religion, five-year age group, sector and local authority type (14,003 GN
  rows; the 5 GNs left out have population 0). DCS folds any ethnic or religious group under 10
  people in a GN into "Other", so GN sums of small groups are lower than the district tables.
  DS and district level only: housing unit structure, wall, roof and floor materials, and
  migration by reason. OHU_DS and HH_DS are legacy .xls files served under an Excel link; the
  snapshots keep the served bytes. Ingest order (D-032): households and amenities, then age,
  sector and local authority type, then DS materials, then ethnicity and religion at DS and
  district level only, from the A-series tables (D-033). Dossier:
  docs/research/sources/dcs-census-2024-topic-tables.md.
