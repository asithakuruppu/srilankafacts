status: active
notes: >-
  Integrated 2026-11-18 from the 75 tiles that carry data (the 76th file is tiles.geojson). Read from the
  files: EPSG:3857, 1.194 m pixels, uint8 metres, no nodata flag; 255 occurs once in the coarse overviews and
  is treated as no data. Ground area is corrected from Web Mercator per block. Read at full resolution (all
  11,830 blocks), 25 minutes. The imagery capture years are NOT stated in the files, tiles.geojson or the
  AWS registry page (it says only Vantor imagery, (c) 2016, and a separate observation-date file that is not
  in the bucket path held), so the period 2026 is the map's publication year and not an observation date ❓.
  A pixel value of 0 means no height above ground (bare, built, open water and sea alike); the place's mean
  therefore includes zeros. National results: mean 6.24 m; 49.1% of land at 5 m or taller, 14.9% at 15 m or
  taller, 0.27% at 30 m or taller. Not comparable with Hansen tree cover 2000 (59.8%, canopy cover not height)
  or WorldCover tree class (72.1%). No comparison with field inventories or the Forest Department ❓.
  Model output: tall plantation, orchards and trees outside forests count as canopy.
