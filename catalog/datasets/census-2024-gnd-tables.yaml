notes: >
  Two workbooks are held, not the full topic set: (1) GN population by sex and age group
  (provisional; 14,008 GN rows, 340 DS divisions) and (2) occupied housing units by GN
  (14,008 GN rows). Both carry DCS codes and no geometry, so the source CRS does not apply.
  DS and higher aggregates are sums of the GN rows; 41 DCS GN units are not yet matched to the
  spine (G02 review queue; 63 when preview.1 was built, before the lead accepted 22 matches on 2026-11-12) and enter DS/district totals but not GN-level output. DCS 5224
  Kalmunai is not joined to COD-AB LK5221 (D-022). Rights are unclear. D-030 (2026-11-12): the lead allows
  non-commercial publication with attribution and a notice before DCS replies; commercial use
  stays forbidden. The `publication` block records it; the release builder then allows a
  public release marked non-commercial, with the attribution and notice in every payload. Dossier:
  docs/research/sources/dcs.md. Method: docs/methods/census-2024.md.
