notes: 'Extract of release 2026-10-21.0 by bounding box: 8,886,949 footprints (4,677,986 first sourced
  from Google Open Buildings, 3,394,052 from OpenStreetMap, 814,911 from Microsoft), 878 MB, held on the
  external archive drive. ODbL. Physical attributes only; 4,338 footprints carry a height. Rolled up to
  places as counts, footprint area, size classes (under 20 m2, 250 m2 or more), mean compactness and density (2026-11-21). Against Census 2024 there are 1.47 footprints per occupied housing
  unit; 7.3% of GN divisions have fewer footprints than housing units (docs/research/spatial/findings-2026-11-17.md).
  Individual footprints are not published (G08 admission test and the map-publication legal check are
  still open).'
