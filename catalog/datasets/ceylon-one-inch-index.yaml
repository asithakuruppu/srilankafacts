notes: >-
  Integrated 2026-11-18 from index_map.geojson (72 sheet footprints, EPSG:4326, also stated in the shapefile
  .prj and the Stanford metadata XML; series by the Survey Department of Ceylon, 1958-1976, public domain per
  the Stanford record). 67 sheets are marked available (scanned) and 5 are not; the scan links (PURL and IIIF
  manifest) are in the sheet table but the scans themselves are NOT downloaded, so nothing about map content
  is used. The index gives sheet extents only; positional accuracy of the drawn footprints is not checked
  against the printed sheets. The shapefile parts were each stored in their own snapshot folder, so the
  shapefile cannot be opened from raw/ as it is; the GeoJSON is used and the shapefile is not compared with
  it. A sheet 'covers' a place if it overlaps at least 1% of the place's area (chosen, not from the source);
  every GN division has at least one sheet and no more than four. The period 1976 is the end of the series;
  sheets were printed across 1958-1976.
