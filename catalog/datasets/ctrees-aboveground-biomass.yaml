notes: 'GeoTIFF held (2026-11-17), rolled up 2026-11-21. Units and year read from the HDX dataset record (lka-ctrees-aboveground-biomass, 2025, CC BY): int16 stored times 10, megagrams per hectare of above-ground live biomass; -9999 is no data. The file is clipped to the country boundary, so coastal GN divisions are partly uncovered (measured area is 99.6% of the spine area; 6 GN divisions have no pixel). CTrees'' per-pixel uncertainty and belowground biomass are not in this dataset. Modelled, not measured on the ground; not compared with a published national figure.'
