status: active
notes: >-
  Integrated 2026-11-18: 45 annual totals (1981-2025) as area-weighted means per GN division, rolled up
  to every level, plus the 1991-2020 average. CRS read from the files (EPSG:4326, 0.05 degree, global,
  no-data written as negative values, not flagged in the file). Cells are about 5 km, so a GN division
  carries the value of the cell around it; the information floor is the 5 km cell. CHIRPS is land-only:
  35 small coastal GN divisions have no valid cell and are not_available. 2025 is the newest year held
  and may be preliminary ❓. Not compared with station records or the Department of Meteorology.
