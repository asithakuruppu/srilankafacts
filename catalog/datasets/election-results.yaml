pipeline_module: slf.datasets.election_results
schedule: manual
geography_scheme: electoral
geography_vintage: ec-2024
reference_period: "2024-09-21"
rights: inherit
# D-039 (Accepted 2026-11-16): the lead's non-commercial publication position, as D-030 for DCS. Not a
# licence; rights stay unclear. Values stay machine_extracted; unread cells stay not_available.
publication:
  decision: D-039
  use: non_commercial
  attribution: "Source: Election Commission of Sri Lanka, Presidential Election 2024, official results by polling division and postal votes by electoral district (elections.gov.lk)."
  notice: "The Election Commission has not published reuse terms; Sri Lanka Facts publishes these results non-commercially for public information, has asked for terms, and will correct or remove them on the Commission's request."
  takedown_days: 7
  decided: 2026-11-16
spatial:
  support: area
  scheme: electoral
  level: polling_division
  vintage: ec-2024
  coverage: LK
  measured_in: null
  positional_accuracy: null
  crs_source: not_applicable
  resolution: null
  information_unit: polling_division
  information_count: 160
  derived_by: null
indicators:
  - electors_registered
  - votes_polled
  - votes_valid
  - votes_rejected
  - votes_candidate
  - turnout
  - votes_rejected_share
  - votes_candidate_share
cross_checks:
  - upstream: nuuuwan/lk_elections
    note: "public/data/elections/government-elections-presidential.regions-ec.2024.tsv; comparison only, no licence"
status: proposed
notes: >
  Stage 2. One result PDF per polling division (160) and one postal-vote PDF per electoral district (22),
  plus the register of electors by polling division 2016-2025 (official list of EDs and PDs).
  Postal votes are reported per electoral district and are never pushed down to polling divisions.
  Some PDFs are scans; values are OCR-extracted on-device and stay machine_extracted until the lead
  verifies them. Rights unclear: not publishable until a lead decision (proposed D-035) is Accepted.
