notes: >-
  Integrated 2026-11-18 as national (LK) rows only. Correction: an earlier note here called this a
  district table; the held file (tab and xlsx, 57 rows) has no districts. Values come from Chandra and
  Sarathchandra (2014) and follow one constant growth rate, so they are a smooth reconstruction, not counts.
  The year 1918 appears twice with different values and the file does not say why; both rows are kept.
  Checked against DCS Table 2.1 census totals for 1891, 1901, 1911, 1921, 1931 and 1946: within 0.9%.
  The underlying census sources were not checked, and the tab and xlsx copies were not compared with each other.
