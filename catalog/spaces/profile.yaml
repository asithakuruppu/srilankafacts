# The `profile` space: places and indicators in one coordinate system
# (vector-space-model.md §5, D-015, D-016, prompt A03).
#
# APPROVED RECIPE. No profile vectors have been computed yet. The lead approved this
# recipe on 2026-11-08 (D-025); A03 steps 2-7 may now build
# `vectors/profile_v0.1.parquet`.
#
# Scope is limited to the two DCS 2024 tables actually held: GN population by sex and
# age, and occupied housing units. The `housing_amenities` and `education_work` blocks
# named in the A03 prompt do not exist in the held data and are not implied here.
id: profile
version: "0.1"
title: Population and housing profile
entity_types: [place, indicator]
metric: euclidean
inputs:
  - { id: population_total, kind: indicator, weight: 1.0 }
  - { id: population_age_0_14, kind: indicator, weight: 1.0 }
  - { id: population_age_15_59, kind: indicator, weight: 1.0 }
  - { id: population_age_60_64, kind: indicator, weight: 1.0 }
  - { id: population_age_65_plus, kind: indicator, weight: 1.0 }
  - { id: sex_ratio, kind: indicator, weight: 1.0 }
  - { id: occupied_housing_units, kind: indicator, weight: 1.0 }
  - { id: persons_per_occupied_housing_unit, kind: indicator, weight: 1.0 }
  - { id: population_density, kind: indicator, weight: 1.0 }
transformations:
  - "population_total -> log10(persons)"
  - "age counts 0-14, 15-59, 60-64 and 65+ -> share of population_total; the four shares sum to 100 and one axis is therefore redundant"
  - "sex_ratio -> log10(males per 100 females); a place with zero females is excluded, not given a made-up ratio"
  - "occupied_housing_units -> log10(units)"
  - "persons_per_occupied_housing_unit -> log10(persons per unit)"
  - "population_density -> log10(persons per km2)"
  - "standardise each transformed indicator to mean 0 and standard deviation 1 across places, separately at GN and at DS level"
  - "winsorise standardised values at ±5; record the number clipped per indicator in the QA report"
  - "blocks: demography = population_total, four age shares, sex_ratio (6 indicators); housing = occupied_housing_units, persons_per_occupied_housing_unit, population_density (3 indicators)"
  - "equal block weight: scale each block's columns by 1/sqrt(number of indicators in the block), so each block carries total variance 1 before PCA"
  - "missing values: no imputation; a place is in the vector only when all 9 inputs are present and population_total >= 100, otherwise it is listed with its reason"
  - "PCA by SVD on the places x indicators matrix; retain components with eigenvalue > 1.0 and at least 3 loadings with |loading| >= 0.4; cap at 6 axes; store all computed axes"
  - "distance = Euclidean over the retained axes; squared distance decomposes exactly into axis contributions, and each axis into the named indicators"
excludes: [ethnicity, religion]
status: active
method_notes: >
  Approved by the lead on 2026-11-08 (D-025); no vectors have been computed yet. A03
  steps 2-7 are authorised. The joint space puts places and indicators in one coordinate
  system. Place coordinates
  come from the PCA scores; indicator coordinates come from the same loadings, so a
  place-to-place distance, an indicator-to-indicator distance and a place-to-indicator
  relation are all readings of one factorisation. Every result must record
  space_id=profile and space_version=0.1; a distance is a similarity statement, never a
  fact, and never a ranking of places as better or worse.

  Blocks. The A03 prompt names demography, housing_amenities and education_work. Only
  demography and housing exist in the two held DCS workbooks, so the space has two
  blocks and 9 indicators. Amenities and education/work are deferred until those tables
  are held and catalogued; this recipe must not be read as covering them.

  Why these transformations. Population, housing units, density and the sex ratio are
  right-skewed and multiplicative, so logs are used. Age counts become shares so the
  space describes age structure rather than settlement size. Absolute size still enters
  once, as log population_total, inside the demography block. The four age shares are
  linearly dependent (they sum to 100); that is accepted, the redundant direction gets a
  near-zero eigenvalue and is not retained.

  Standardisation and weighting. Standardising at each level separately keeps GN and DS
  spaces internally comparable; it does not put GN and DS distances on one scale, so
  cross-level distance is not published. Equal block weights stop the six demographic
  indicators from drowning the three housing indicators. Winsorising at ±5 SD limits the
  leverage of a handful of extreme ratios; the count clipped is reported.

  Axes. Kaiser's eigenvalue > 1 rule plus a loading rule gives readable axes. Axis
  labels are drafts generated by the pipeline and marked AI-generated until the lead
  approves them (AGENTS.md rule 7). The full set of computed axes is stored, so the
  distance decomposition can be audited even for axes not retained for display.

  Missing values and exclusions. There is no imputation. A place missing any input, or
  with population below 100, gets no vector and is listed with a reason. That includes
  the five zero-population GNs, GNs with no DCS row and any unit whose sex ratio is
  undefined. The same rule is applied at DS level.

  Verification level. The space is derived, not observed. Every vector, neighbour list
  and axis label is machine-computed; no human has validated the axes or the neighbour
  lists. Published census values remain the ledger and are never replaced by a vector.
